[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/gui"]
default-members = ["crates/core", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lmg6983-dotcom/image_whitespace_killer"

[workspace.dependencies]
trim-core = { path = "crates/core" }
anyhow = "1.0.104"

[profile.release]
lto = true
codegen-units = 1
strip = true
